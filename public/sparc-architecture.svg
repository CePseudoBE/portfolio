<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SPARC architecture</title>
  <desc id="d">Write path: LoRaWAN sensors through three campus gateways and ChirpStack v4, MQTT 5.0 devices through Mosquitto over TLS, and HTTP devices with one API key each, all into the Rust ingestion adapters, then NATS JetStream with a dead-letter queue, idempotent Rust consumers, and TimescaleDB. Read path: users open the Nuxt 4 web app on OKD, sign in with Authentik over OIDC, and call the Rust query API, which verifies tokens against the JWKS, applies RBAC and reads TimescaleDB continuous aggregates. The backend also sends threshold alerts by email, runs asynchronous CSV exports and derives device status from last activity. Prometheus and Grafana monitor the platform.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1a1a1a}
    .n{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#555}.l{font-size:13px;fill:#555}
    .b{fill:#fff;stroke:#1a1a1a;stroke-width:1.2}
    .r{fill:#eef3fb;stroke:#1f5fbf;stroke-width:1.5}
    .m{fill:none;stroke:#888;stroke-width:1.2;stroke-dasharray:5 4}
    .a{fill:none;stroke:#1a1a1a;stroke-width:1.2;marker-end:url(#h)}
    .d{fill:none;stroke:#555;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#h)}
    #h path{fill:#1a1a1a}
    @media (prefers-color-scheme:dark){
      text{fill:#e6e6e6}.s,.l{fill:#a6a6a6}
      .b{fill:#141414;stroke:#e6e6e6}.r{fill:#17233a;stroke:#8ab4f8}
      .a{stroke:#e6e6e6}.d{stroke:#a6a6a6}#h path{fill:#e6e6e6}
    }
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker></defs>

  <rect class="r" x="0" y="6" width="14" height="14"/>
  <text class="l" x="22" y="18">Rust backend: one service, 8 crates</text>

  <!-- Write path -->
  <text class="l" x="0" y="50">Write path</text>
  <rect class="b" x="0" y="60" width="170" height="60"/>
  <text class="n" x="12" y="84">LoRaWAN sensors</text><text class="s" x="12" y="104">3 campus gateways</text>
  <rect class="b" x="0" y="140" width="170" height="60"/>
  <text class="n" x="12" y="164">MQTT 5.0 devices</text>
  <rect class="b" x="0" y="220" width="170" height="60"/>
  <text class="n" x="12" y="244">HTTP devices</text><text class="s" x="12" y="264">one API key each</text>

  <rect class="b" x="210" y="60" width="150" height="60"/>
  <text class="n" x="222" y="84">ChirpStack v4</text><text class="s" x="222" y="104">network server</text>
  <rect class="b" x="210" y="140" width="150" height="60"/>
  <text class="n" x="222" y="164">Mosquitto</text><text class="s" x="222" y="184">TLS</text>

  <path class="a" d="M170 90h38"/><path class="a" d="M360 90h38"/><path class="a" d="M170 170h38"/><path class="a" d="M360 170h38"/><path class="a" d="M170 250h228"/>

  <rect class="r" x="400" y="60" width="150" height="220"/>
  <text class="n" x="412" y="84">Ingestion</text>
  <text class="s" x="412" y="104">adapters per protocol</text>
  <text class="s" x="412" y="122">Axum, Tokio</text>

  <path class="a" d="M550 170h38"/>
  <rect class="b" x="590" y="120" width="160" height="100"/>
  <text class="n" x="602" y="144">NATS JetStream</text>
  <text class="s" x="602" y="164">durable buffer</text>
  <text class="s" x="602" y="182">dead-letter queue</text>

  <path class="a" d="M750 170h38"/>
  <rect class="r" x="790" y="120" width="140" height="100"/>
  <text class="n" x="802" y="144">Consumers</text>
  <text class="s" x="802" y="164">idempotent</text>

  <path class="a" d="M930 170h38"/>
  <rect class="b" x="970" y="120" width="150" height="310"/>
  <text class="n" x="982" y="144">TimescaleDB</text>
  <text class="s" x="982" y="164">hypertables</text>
  <text class="s" x="982" y="182">compression</text>
  <text class="s" x="982" y="404">continuous</text>
  <text class="s" x="982" y="420">aggregates</text>

  <!-- Read path -->
  <text class="l" x="0" y="335">Read path</text>
  <rect class="b" x="0" y="345" width="170" height="70"/>
  <text class="n" x="12" y="372">Users</text><text class="s" x="12" y="391">CIREM, ULB</text><text class="s" x="12" y="406">infrastructure dept.</text>
  <path class="a" d="M170 380h38"/>
  <rect class="b" x="210" y="345" width="150" height="70"/>
  <text class="n" x="222" y="372">Nuxt 4 web app</text><text class="s" x="222" y="392">on OKD</text>
  <path class="a" d="M360 380h38"/>
  <rect class="b" x="400" y="345" width="150" height="70"/>
  <text class="n" x="412" y="372">Authentik</text><text class="s" x="412" y="392">OIDC sign-in</text>

  <rect class="r" x="790" y="345" width="140" height="70"/>
  <text class="n" x="802" y="372">Query API</text><text class="s" x="802" y="392">Axum, RBAC</text>
  <path class="d" d="M790 380H552"/>
  <text class="s" x="671" y="372" text-anchor="middle">checks tokens (JWKS)</text>
  <path class="a" d="M930 380h38"/>
  <path class="a" d="M285 415v27h575v-25"/>
  <text class="s" x="572" y="436" text-anchor="middle">API calls with token</text>

  <rect class="r" x="210" y="465" width="720" height="56"/>
  <text class="n" x="222" y="488">Also in the backend</text>
  <text class="s" x="222" y="508">threshold alerts by email · asynchronous CSV exports · device status from last activity · LoRaWAN fleet management</text>

  <rect class="m" x="0" y="542" width="1120" height="40"/>
  <text class="s" x="560" y="567" text-anchor="middle">Prometheus + Grafana: metrics and dashboards for the platform</text>
</svg>
