<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SPARC architecture</title>
  <desc id="d">LoRaWAN sensors reach the campus gateways and ChirpStack v4 on a separate VM, which publishes over MQTT with TLS to the platform's Mosquitto broker. MQTT 5.0 devices connect to Mosquitto over TLS 1.3 with authentication and ACLs. HTTP devices go through Traefik. The Rust iot-ingestion binary reads Mosquitto on the internal network, maps ChirpStack payloads to FIWARE, checks per-device API keys for HTTP, and publishes to the NATS JetStream stream OBSERVATIONS. The Rust iot-processing binary validates each reading against the metric registry, stores it in TimescaleDB and evaluates alert thresholds, sending emails through an SMTP relay; invalid readings go to the DLQ_OBSERVATIONS stream. Users open the Nuxt 4 web app on OKD, sign in with Authentik, and call the Rust iot-api binary, which checks tokens against the JWKS, applies RBAC, reads TimescaleDB continuous aggregates, runs the CSV export workers and manages the LoRaWAN fleet through ChirpStack's gRPC API. Grafana reads the aggregates directly and Prometheus scrapes the three Rust binaries.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1a1a1a}
    .n{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#555}.l{font-size:13px;fill:#555}.e{font-size:11.5px;fill:#555}
    .b{fill:#fff;stroke:#1a1a1a;stroke-width:1.2}
    .r{fill:#eef3fb;stroke:#1f5fbf;stroke-width:1.5}
    .q{fill:#fdf1ec;stroke:#b8461f;stroke-width:1.2}
    .m{fill:none;stroke:#888;stroke-width:1.2;stroke-dasharray:5 4}
    .a{fill:none;stroke:#1a1a1a;stroke-width:1.2;marker-end:url(#h)}
    .d{fill:none;stroke:#555;stroke-width:1.2;stroke-dasharray:4 3;marker-end:url(#h)}
    .x{fill:none;stroke:#b8461f;stroke-width:1.2;marker-end:url(#hx)}
    #h path{fill:#1a1a1a}#hx path{fill:#b8461f}
    @media (prefers-color-scheme:dark){
      text{fill:#e6e6e6}.s,.l,.e{fill:#a6a6a6}
      .b{fill:#141414;stroke:#e6e6e6}.r{fill:#17233a;stroke:#8ab4f8}.q{fill:#2a1a14;stroke:#e08a66}
      .a{stroke:#e6e6e6}.d{stroke:#a6a6a6}.x{stroke:#e08a66}#h path{fill:#e6e6e6}#hx path{fill:#e08a66}
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker>
    <marker id="hx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="r" x="0" y="6" width="14" height="14"/>
  <text class="l" x="22" y="18">Rust: one workspace, 8 crates, 3 binaries from one image</text>
  <text class="l" x="0" y="48">Write path</text>

  <!-- sources -->
  <rect class="b" x="0" y="60" width="170" height="60"/>
  <text class="n" x="12" y="84">LoRaWAN sensors</text><text class="s" x="12" y="104">existing campus gateways</text>
  <rect class="b" x="0" y="160" width="170" height="60"/>
  <text class="n" x="12" y="184">MQTT 5.0 devices</text>
  <rect class="b" x="0" y="250" width="170" height="60"/>
  <text class="n" x="12" y="274">HTTP devices</text><text class="s" x="12" y="294">one API key each</text>

  <!-- edge -->
  <rect class="b" x="210" y="60" width="170" height="60"/>
  <text class="n" x="222" y="84">ChirpStack v4</text><text class="s" x="222" y="104">separate VM</text>
  <rect class="b" x="210" y="160" width="170" height="60"/>
  <text class="n" x="222" y="184">Mosquitto</text><text class="s" x="222" y="204">TLS 1.3, auth, ACLs</text>
  <rect class="b" x="210" y="250" width="170" height="60"/>
  <text class="n" x="222" y="274">Traefik</text><text class="s" x="222" y="294">/ingest, rate limit</text>

  <path class="a" d="M170 90h38"/>
  <path class="a" d="M295 120v38"/><text class="e" x="303" y="143">MQTT, TLS</text>
  <path class="a" d="M170 190h38"/>
  <path class="a" d="M170 280h38"/>

  <!-- ingestion -->
  <rect class="r" x="420" y="60" width="170" height="250"/>
  <text class="n" x="432" y="84">iot-ingestion</text>
  <text class="s" x="432" y="106">ChirpStack → FIWARE</text>
  <text class="s" x="432" y="122">(YAML mappings)</text>
  <text class="s" x="432" y="144">API key check</text>
  <text class="s" x="432" y="160">(HMAC-SHA256)</text>
  <text class="s" x="432" y="182">structural parse</text>
  <path class="a" d="M380 190h38"/><text class="e" x="222" y="236">to ingestion: internal, no TLS</text>
  <path class="a" d="M380 280h38"/>

  <!-- NATS -->
  <path class="a" d="M590 140h38"/>
  <rect class="b" x="630" y="90" width="170" height="100"/>
  <text class="n" x="642" y="114">NATS JetStream</text>
  <text class="s" x="642" y="134">stream OBSERVATIONS</text>
  <text class="s" x="642" y="152">durable buffer</text>
  <rect class="q" x="630" y="240" width="170" height="70"/>
  <text class="n" x="642" y="264">Dead-letter queue</text>
  <text class="s" x="642" y="284">DLQ_OBSERVATIONS</text>

  <!-- processing -->
  <path class="a" d="M800 140h38"/>
  <rect class="r" x="840" y="60" width="170" height="250"/>
  <text class="n" x="852" y="84">iot-processing</text>
  <text class="s" x="852" y="106">1. validate</text>
  <text class="s" x="852" y="122">(metric registry)</text>
  <text class="s" x="852" y="144">2. store (idempotent)</text>
  <text class="s" x="852" y="166">3. alert thresholds</text>
  <path class="x" d="M840 275H802"/><text class="e" x="821" y="268" text-anchor="middle">invalid</text>

  <path class="a" d="M925 310v38"/>
  <rect class="b" x="840" y="350" width="170" height="56"/>
  <text class="n" x="852" y="373">Email alerts</text><text class="s" x="852" y="393">SMTP relay</text>

  <!-- TimescaleDB -->
  <path class="a" d="M1010 140h38"/>
  <rect class="b" x="1050" y="60" width="150" height="490"/>
  <text class="n" x="1062" y="84">TimescaleDB</text>
  <text class="s" x="1062" y="106">measurements</text>
  <text class="s" x="1062" y="122">(hypertable,</text>
  <text class="s" x="1062" y="138">compressed)</text>
  <text class="s" x="1062" y="290">export_jobs:</text>
  <text class="s" x="1062" y="306">the export queue</text>
  <text class="s" x="1062" y="322">(SKIP LOCKED)</text>
  <text class="s" x="1062" y="500">continuous</text>
  <text class="s" x="1062" y="516">aggregates</text>
  <text class="s" x="1062" y="532">hourly → daily</text>

  <!-- read path -->
  <text class="l" x="0" y="458">Read path</text>
  <rect class="b" x="0" y="470" width="170" height="70"/>
  <text class="n" x="12" y="495">Users</text><text class="s" x="12" y="514">CIREM, ULB</text><text class="s" x="12" y="530">infrastructure dept.</text>
  <path class="a" d="M170 505h38"/>
  <rect class="b" x="210" y="470" width="170" height="70"/>
  <text class="n" x="222" y="495">Nuxt 4 web app</text><text class="s" x="222" y="514">BFF, on OKD</text>
  <path class="a" d="M380 505h38"/>
  <rect class="b" x="420" y="470" width="170" height="70"/>
  <text class="n" x="432" y="495">Authentik</text><text class="s" x="432" y="514">OIDC sign-in</text>

  <rect class="r" x="840" y="440" width="170" height="100"/>
  <text class="n" x="852" y="464">iot-api</text>
  <text class="s" x="852" y="484">Axum, RBAC</text>
  <text class="s" x="852" y="500">CSV export workers</text>
  <text class="s" x="852" y="516">LoRaWAN fleet (gRPC)</text>
  <path class="d" d="M840 505H592"/>
  <text class="s" x="716" y="497" text-anchor="middle">checks tokens (JWKS)</text>
  <path class="a" d="M1010 505h38"/>
  <path class="a" d="M295 540v28h630v-26"/>
  <text class="s" x="610" y="562" text-anchor="middle">API calls with token</text>

  <rect class="b" x="1050" y="580" width="150" height="50"/>
  <text class="n" x="1062" y="602">Grafana</text><text class="s" x="1062" y="620">SQL on aggregates</text>
  <path class="a" d="M1125 580v-28"/>

  <rect class="m" x="0" y="648" width="1200" height="36"/>
  <text class="s" x="600" y="671" text-anchor="middle">Prometheus scrapes metrics from the three Rust binaries</text>
</svg>
